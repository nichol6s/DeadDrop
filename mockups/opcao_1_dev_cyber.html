<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeadDrop - Opção 1: Dev-Cyber Minimalista</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#090D16] text-slate-200 font-sans min-h-screen flex flex-col items-center justify-between p-4 selection:bg-emerald-500/30 selection:text-emerald-300">

  <!-- Top Banner / Navigation -->
  <header class="w-full max-w-3xl flex items-center justify-between py-6 border-b border-slate-800/80">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-mono font-bold text-lg">
        &gt;_
      </div>
      <div>
        <h1 class="text-base font-semibold tracking-tight text-white flex items-center gap-2">
          DeadDrop <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-slate-400 font-mono">v0.2.0</span>
        </h1>
        <p class="text-xs text-slate-400">Compartilhamento Efêmero & Zero-Knowledge</p>
      </div>
    </div>
    <div class="flex items-center gap-2 text-xs font-mono text-emerald-400/90 bg-emerald-950/40 border border-emerald-800/50 px-3 py-1.5 rounded-full">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      Client AES-256-GCM ativo
    </div>
  </header>

  <!-- Main Card -->
  <main class="w-full max-w-2xl my-auto py-8">
    <div class="bg-[#0f172a]/70 border border-slate-800 rounded-2xl p-6 md:p-8 backdrop-blur shadow-2xl shadow-black/60 relative overflow-hidden">
      <!-- Glow effect -->
      <div class="absolute -top-24 -right-24 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <div class="flex items-center justify-between mb-4">
        <label class="text-xs font-mono uppercase tracking-wider text-slate-400 flex items-center gap-2">
          <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
          Carga Secreta (Mensagem, .env ou Chaves)
        </label>
        <span class="text-xs font-mono text-slate-500">Cifrado no navegador antes do envio</span>
      </div>

      <!-- Secret Input -->
      <div class="relative">
        <textarea rows="6" placeholder="// Cole aqui sua chave de API, variáveis de ambiente ou texto confidencial...&#10;DATABASE_URL=postgres://user:super_secret@cluster:5432/prod" class="w-full bg-[#070b13] border border-slate-800 rounded-xl p-4 font-mono text-sm text-emerald-300 placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/50 transition-all resize-none"></textarea>
      </div>

      <!-- Options Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-5">
        <div>
          <label class="block text-xs font-mono uppercase text-slate-400 mb-1.5">Destruição Automática</label>
          <select class="w-full bg-[#070b13] border border-slate-800 text-xs font-mono text-slate-300 rounded-lg p-2.5 focus:outline-none focus:border-emerald-500/50">
            <option>1 visualização (Burn-after-reading imediato)</option>
            <option>1 hora após o envio</option>
            <option>24 horas após o envio</option>
            <option>7 dias após o envio</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-mono uppercase text-slate-400 mb-1.5">Senha de Proteção (Opcional)</label>
          <input type="password" placeholder="Derivação via PBKDF2" class="w-full bg-[#070b13] border border-slate-800 text-xs font-mono text-slate-300 rounded-lg p-2.5 focus:outline-none focus:border-emerald-500/50 placeholder-slate-600">
        </div>
      </div>

      <!-- Action Button -->
      <button class="w-full mt-6 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 active:scale-[0.99]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        <span>Cifrar e Gerar DeadDrop</span>
      </button>

      <!-- Simulated Output State (What user sees after generation) -->
      <div class="mt-6 pt-5 border-t border-slate-800/80">
        <div class="flex items-center justify-between text-xs font-mono text-slate-400 mb-2">
          <span>Prévia do Link Gerado (Simulação):</span>
          <span class="text-amber-400 flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            Chave (#) nunca trafega na rede
          </span>
        </div>
        <div class="flex items-center gap-2 bg-[#070b13] border border-slate-800/80 rounded-xl p-2.5">
          <input type="text" readonly value="https://deaddrop.dev/secret/8f3a9b1c#k=9x8y7z6w5v4u3t2s1r0q" class="bg-transparent text-xs font-mono text-emerald-400 w-full focus:outline-none select-all">
          <button class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-mono text-white rounded-lg flex items-center gap-1 shrink-0">
            Copiar
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full max-w-3xl py-4 border-t border-slate-800/80 text-center text-xs font-mono text-slate-500">
    ENIAC 2026 • Distributed & Secure Solutions • Zero-Knowledge Architecture
  </footer>

</body>
</html>
